name: Cazoo
description: 'Cazoo was a UK online used-car retailer founded in 2018 by Alex Chesterman, offering
  a direct-to-consumer platform to buy, sell, and finance used cars fully online with home delivery.
  The company listed on the New York Stock Exchange via a SPAC merger in 2021 before restructuring and
  entering administration in 2024; its consumer marketplace brand was subsequently sold. Cazoo was
  surfaced as a portfolio company of D1 Capital, General Catalyst, and Sapphire Ventures and added to
  the API Evangelist network for enrichment. No public developer portal or API surface was found during
  enrichment: the site is behind bot protection (HTTP 429) and no /.well-known/ discovery documents are
  published. Sector: ecommerce / automotive retail.'
